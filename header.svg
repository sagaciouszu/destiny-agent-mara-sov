<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mara Sov - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070414"/>
      <stop offset="50%" stop-color="#0d0726"/>
      <stop offset="100%" stop-color="#161038"/>
    </linearGradient>
    <radialGradient id="violetglow" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealglow" cx="0.12" cy="0.55" r="0.35">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#violetglow)"/>
  <rect width="1200" height="320" fill="url(#tealglow)"/>

  <!-- starfield -->
  <g fill="#e8e6f0">
    <circle cx="120" cy="52" r="1.1" opacity="0.7"/>
    <circle cx="240" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="350" cy="60" r="1.3" opacity="0.8"/>
    <circle cx="470" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="560" cy="70" r="1" opacity="0.6"/>
    <circle cx="660" cy="250" r="1.2" opacity="0.7"/>
    <circle cx="740" cy="90" r="0.8" opacity="0.5"/>
    <circle cx="830" cy="220" r="1" opacity="0.6"/>
    <circle cx="70" cy="230" r="0.9" opacity="0.5"/>
    <circle cx="1050" cy="60" r="1.1" opacity="0.7"/>
    <circle cx="1130" cy="250" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="270" r="1" opacity="0.6"/>
    <circle cx="520" cy="150" r="0.7" opacity="0.4"/>
    <circle cx="900" cy="120" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="180" r="0.7" opacity="0.4"/>
    <circle cx="770" cy="270" r="0.8" opacity="0.5"/>
  </g>

  <g stroke="#a78bfa" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Awoken-inspired sigil (right): ring, oath-diamond, four-point star -->
  <g transform="translate(980,160)" opacity="0.85" fill="none" stroke="#a78bfa">
    <circle r="98" stroke-width="1.2" opacity="0.45"/>
    <circle r="82" stroke-width="0.7" opacity="0.3"/>
    <path d="M 0 -64 L 46 0 L 0 64 L -46 0 Z" stroke-width="1.4" opacity="0.8"/>
    <path d="M 0 -30 L 8 -8 L 30 0 L 8 8 L 0 30 L -8 8 L -30 0 L -8 -8 Z" fill="#a78bfa" stroke="none" opacity="0.9"/>
    <circle r="3.5" fill="#e8e6f0" stroke="none" opacity="0.9"/>
    <circle cx="-64" cy="-64" r="2" fill="#5eead4" stroke="none" opacity="0.7"/>
    <circle cx="64" cy="64" r="2" fill="#5eead4" stroke="none" opacity="0.7"/>
    <circle cx="64" cy="-64" r="1.5" fill="#e8e6f0" stroke="none" opacity="0.5"/>
    <circle cx="-64" cy="64" r="1.5" fill="#e8e6f0" stroke="none" opacity="0.5"/>
  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#a78bfa">
    <circle cx="980" cy="160" r="112" stroke-width="0.7" opacity="0.18"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ QUEEN  ·  REEF  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">MARA SOV</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">GUARDIAN. WALK WITH ME.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#a78bfa" letter-spacing="8">[ QUEEN  ·  REEF  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#f5f3ff" letter-spacing="2">MARA SOV</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#c4b5fd" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">GUARDIAN. <tspan x="178" fill="#a78bfa">WALK WITH ME.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#a78bfa" opacity="0.25">REEF  ·  DREAMING CITY  ·  2.7 AU</text>

  <g fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>
